baseURL: "https://www.kyleheller.dev/"
languageCode: en-us
title: Kyle Heller
theme: PaperMod
paginate: 10

params:
  env: production
  defaultTheme: dark
  disableThemeToggle: false
  showReadingTime: true
  showShareButtons: false
  showPostNavLinks: true
  showBreadCrumbs: true
  showCodeCopyButtons: true
  showToc: false

  homeInfoParams:
    Title: "Kyle Heller"
    Content: ""

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/-kyle-heller/"
    - name: github
      url: "https://github.com/kyle-heller"
    - name: twitter
      url: "https://twitter.com/KyleHellerDev"
    - name: rss
      url: "https://blog.kyleheller.dev/feed.xml"

  assets:
    favicon: "/favicon.ico"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: certifications
      name: Certifications
      url: /certifications/
      weight: 40
    - identifier: blog
      name: Blog
      url: https://blog.kyleheller.dev/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
